<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer RFID Portal</title>
  <link rel="stylesheet" href="somic.css" />
  <script defer src="features.js"></script>
  <script defer src="translations.js"></script>
</head>

<body>


  <main class="main-layout">
    <img id="preview" style="max-width:1000px; display:none">
    <section class="format-window">
      <h2 id="assigned-parts-title">Assigned Parts</h2>
      <div id="assigned-parts-list" class="parts-list"></div>
      <div class="final-check">
        <label><input type="checkbox" id="final-check" disabled> <span id="final-check-label">All parts assigned</span></label>
      </div>
    </section>

    <!-- Right Side: All Formats -->
    <section class="all-formats-window">
      <h2 id="all-format-parts-title">All Format Parts</h2>
      <div class="controls">
        <button id="btn-read-tags" onclick="readRFIDTags()">Read RFID Tags</button>
        <button id="btn-refresh-parts" onclick="refreshFormatParts()">🔄 Refresh Parts</button>
      </div>
      <div id="format-parts-list" class="parts-list"></div>
    </section>
  </main>
  <script>
    // If embedded via Next iframe, allow the parent to push updates too
    (function() {
      try {
        // If parent provided ?lang param, translations.js will pick it up.
        // No additional bootstrap needed here.
      } catch {}
    })();
  </script>
</body>

</html>
