<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Customer RFID Portal</title>
  <link rel="stylesheet" href="somic.css" />
  <script defer src="features.js"></script>
  <script defer src="translations.js"></script>
</head>
<body>
 
<div class="upload-section">
  <input type="file" id="fileInput" accept=".html" />
  <button onclick="handleFileUpload()">Upload Format File</button>
</div>

  
  <main class="main-layout">
    <section class="format-window">
      <h2>Assigned Parts</h2>
      <div id="assigned-parts-list" class="parts-list"></div>
      <div class="final-check">
        <label><input type="checkbox" id="final-check" disabled> All parts assigned</label>
      </div>
    </section>

    <!-- Right Side: All Formats -->
    <section class="all-formats-window">
      <h2>All Format Parts</h2>
      <div class="controls">
        <button onclick="readRFIDTags()">Read RFID Tags</button>
        <button onclick="refreshFormatParts()">🔄 Refresh Parts</button>
      </div>
      <div id="format-parts-list" class="parts-list"></div>
    </section>
  </main>

<!-- Add this inside <body> -->
<button onclick="fetchRFIDTags()">Read RFID Tags</button>
<div id="rfid-result"></div>

<script>
  async function fetchRFIDTags() {
    try {
      const response = await fetch('/api/opcua');
      const data = await response.json();

      const container = document.getElementById('rfid-result');
      if (data.tags && data.tags.length > 0) {
        container.innerHTML = "<b>Detected RFID Tags:</b><br>" + data.tags.join("<br>");
      } else {
        container.innerHTML = "No tags detected.";
      }
    } catch (err) {
      console.error("RFID read error:", err);
      document.getElementById('rfid-result').innerText = "Error reading tags.";
    }
  }
</script>


</body>
</html>
