name: release
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release-Version (z.B. V0.0.1)'
        required: true
        type: string
jobs:
  deploy:
    uses: ./.github/workflows/deploy_image.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ github.event.release.tag_name || inputs.version }}
