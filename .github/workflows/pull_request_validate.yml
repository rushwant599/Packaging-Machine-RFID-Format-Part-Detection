name: Validate pull request
on:
  workflow_dispatch:
  pull_request:
jobs:
  frontend-lint:
    name: Lint frontend with ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
