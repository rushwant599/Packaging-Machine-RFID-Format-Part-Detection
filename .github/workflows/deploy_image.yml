name: Deploy Image
on:
  push:
    branches: [main, develop]
    tags: ['*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional image tag to push (e.g. V0.1.1). If provided, this exact tag will be pushed to GHCR.'
        required: false
        default: ''
  workflow_call:
    inputs:
      tag:
        description: 'Optional image tag to push (e.g. V0.1.1). When called as a reusable workflow, provide this input.'
        required: false
        type: string
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - id: namespace
        uses: ./.github/actions/lowercase
        with:
          input: ${{ github.repository }}
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
      
      - name: Extract metadata (used when no manual tag provided)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.namespace.outputs.output }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Determine tags to push
        id: determine_tags
        run: |
          # Prefer tag from workflow_call inputs ("inputs.tag"), then workflow_dispatch (github.event.inputs.tag)
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG=""
          fi

          TAG=$(echo "$TAG" | tr -d '\r' | tr -d '\n' | xargs || true)

          if [ -n "$TAG" ]; then
            echo "tags=ghcr.io/${{ steps.namespace.outputs.output }}:${TAG}" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ steps.meta.outputs.tags }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.determine_tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max