events {}

http {
    server {
        listen 443 ssl;
        server_name 10.11.36.40;

        ssl_certificate     /etc/nginx/certs/10.11.36.40.pem;
        ssl_certificate_key /etc/nginx/certs/10.11.36.40-key.pem;

        # Frontend (läuft z.B. als Node dev server oder statisch)
        location / {
            proxy_pass http://host.docker.internal:3000;
            proxy_set_header Host $host;
        }

        # Backend (läuft separat auf Port 8001 auf dem Host)
        # HINWEIS: Wir nutzen host.docker.internal, damit der Container den Host erreicht (Docker Desktop/Windows)
        location /api/ {
            proxy_pass http://host.docker.internal:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://host.docker.internal:8001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            # Optionale Stabilitäts-Timeouts für WebSockets
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 60s;
        }

        # Bilder (vom Backend als StaticFiles unter /pictures bereitgestellt)
        location /pictures/ {
            proxy_pass http://host.docker.internal:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
