events {}

http {
  server {
    # Ein Zertifikat nötig, wenn du 443/ssl nutzen willst
    listen 443 ssl default_server;

    # Via envsubst befüllt; fallback wird im entrypoint gesetzt
    server_name ${SERVER_NAME};

    ssl_certificate     /etc/nginx/certs/10.11.36.40.pem;
    ssl_certificate_key /etc/nginx/certs/10.11.36.40-key.pem;

    # Frontend (Next.js)
    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_set_header Host $host;
    }

    # Backend API
    location /api/ {
      proxy_pass http://127.0.0.1:8001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets
    location /ws/ {
      proxy_pass http://127.0.0.1:8001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_connect_timeout 60s;
    }

    # Bilder vom Backend
    location /pictures/ {
      proxy_pass http://127.0.0.1:8001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}