on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '**/requirements.txt'
  pull_request:
    branches:
      - 'main'
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '**/requirements.txt'
  #schedule:
    #- cron: '17 3 * * *'
jobs:
  security_audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Run npm audit
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: |
          npm ci
          npm audit --audit-level high
      - name: Run Python security audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: |
          cd backend
          pip install -r requirements.txt
          pip install safety
          safety check
