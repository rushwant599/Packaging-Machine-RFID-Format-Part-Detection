version: '3.8'

services:
  rfid-app:
    build: .
    ports:
      - "3000:3000"   # Frontend
      - "8001:8001"   # Backend API
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8001
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8001
      - DEBUG=false
    volumes:
      # Mount for persistent data if needed
      - ./customer-html-cache.html:/app/customer-html-cache.html
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health", "&&", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
