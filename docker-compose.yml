version: '3.8'

services:
  rfid-app:
    build: .
    ports:
      - "3000:3000"   # Frontend
      - "8001:8001"   # Backend API
    env_file:
      - .env.example
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health", "&&", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
